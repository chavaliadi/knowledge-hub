name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run Workspace Typecheck
      run: bun run typecheck

    - name: Run Duplicate Regression Check
      run: bun run --cwd packages/server test:duplicate
      env:
        CI: true

    - name: Run LLM Failover Smoke Test
      run: bun run --cwd packages/server test:failover
      env:
        CI: true

    - name: Run Attachment Extraction Unit Test
      run: bun run --cwd packages/server test:attachments
      env:
        CI: true

    - name: Run Health Score Formula Unit Test
      run: bun run --cwd packages/server test:health
      env:
        CI: true

    - name: Run Clipper Extension SSO Unit Test
      run: bun run --cwd packages/server test:clipper
      env:
        CI: true

    - name: Run RLS Isolation Test
      run: bun run --cwd packages/server test:rls
      env:
        CI: true

    - name: Run Multi-Format Entry Ingestion Unit Test
      run: bun run --cwd packages/server test:ingestion
      env:
        CI: true

    - name: Run RAG Chat Route E2E Test
      run: bun run --cwd packages/server test:chat
      env:
        CI: true
