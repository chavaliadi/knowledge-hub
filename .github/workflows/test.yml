name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run Workspace Typecheck
      run: bun run typecheck

    - name: Run Duplicate Regression Check
      run: bun run --cwd packages/server test:duplicate
      env:
        CI: true

    - name: Run LLM Failover Smoke Test
      run: bun run --cwd packages/server test:failover
      env:
        CI: true

    - name: Run Reindexer E2E Verification
      run: bun run --cwd packages/server test:reindex
      env:
        CI: true
